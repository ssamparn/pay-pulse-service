spring:
  application:
    name: pay-pulse-web-api
  datasource:
    url: jdbc:postgresql://localhost:5432/paypulse_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
    default-schema: public
    schemas: public
    create-schemas: true

paypulse:
  processing:
    scheduler:
      batch-size: 50
      fixed-delay-millis: 5000
      initial-delay-millis: 10000
      stuck-batch-recovery-batch-size: 50
      stuck-batch-timeout-millis: 300000
      stuck-batch-recovery-fixed-delay-millis: 30000
      stuck-batch-recovery-initial-delay-millis: 20000
      max-recovery-attempts: 3

