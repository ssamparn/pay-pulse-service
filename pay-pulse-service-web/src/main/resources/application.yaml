spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: pay-pulse-web-api
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:paypulse_db}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
    default-schema: public
    schemas: public
    create-schemas: true

paypulse:
  soap:
    batch-payment:
      uri: http://localhost:7070/ws
    historical-batch:
      uri: http://localhost:7071/ws
  processing:
    scheduler:
      batch-size: 50
      fixed-delay-millis: 5000
      initial-delay-millis: 10000
      stuck-batch-recovery-batch-size: 50
      stuck-batch-timeout-millis: 300000
      stuck-batch-recovery-fixed-delay-millis: 30000
      stuck-batch-recovery-initial-delay-millis: 20000
      max-recovery-attempts: 3
